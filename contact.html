<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>replit</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>

<body> 
 

  <script src="script.js"></script>
<header class="navbar">
    <a href="index.html" class="nav-item">Hogar</a>
    <div class="divider"></div>
    <a href="about.html" class="nav-item">Sobre nosotros</a>
    <div class="divider"></div>
    <a href="contact.html" class="nav-item active">Contáctanos</a>
  </header>

  <!-- 2. Contenedor de 3 columnas -->
  <main class="main-container">

    <!-- Lateral Izquierdo: Anuncio -->
    <aside class="sidebar ad">
      <h3>ANUNCIO</h3>
      <p>Auditorías de código y pentesting para startups.</p>
    </aside>

    <!-- Centro: Formulario de Contacto -->
    <section class="content contact-content">
      <div class="form-container">
        <span class="hud-tag">SECURE_CHANNEL</span>
        <h2>Envía un Mensaje</h2>
        <p class="form-subtext">Establece comunicación directa con nuestro equipo técnico.</p>

        <form class="tech-form" onsubmit="event.preventDefault(); alert('Mensaje enviado');">
          <div class="form-group">
            <label for="name">Nombre / Alias</label>
            <input type="text" id="name" placeholder="Ej. Alex Vance" required>
          </div>

          <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" placeholder="usuario@dominio.tech" required>
          </div>

          <div class="form-group">
            <label for="message">Detalles del Requerimiento</label>
            <textarea id="message" rows="4" placeholder="Describe tu proyecto o consulta técnica..." required></textarea>
          </div>

          <button type="submit" class="btn-submit">Transmitir Mensaje</button>
        </form>
      </div>
    </section>

    <!-- Lateral Derecho: Noticias -->
    <aside class="sidebar news">
      <h3>NOTICIAS</h3>
      <p>Soporte de incidentes crítico disponible vía PGP.</p>
    </aside>

  </main>

  <!-- 3. Footer -->
  <footer class="footer">
    <p>&copy; 2026 - Mi Sitio Tech</p>
  </footer>
  <!--
  This script places a badge on your repl's full-browser view back to your repl's cover
  page. Try various colors for the theme: dark, light, red, orange, yellow, lime, green,
  teal, blue, blurple, magenta, pink!
  -->

  <script src="https://replit.com/public/js/replit-badge-v2.js" theme="dark" position="bottom-right"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
